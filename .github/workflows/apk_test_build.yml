name: Signed APK build (safe-svg font-face fix)

# Signed APK for the fork, with production runtime, name and icon. Not meant for upstream.
# It is built from the `regression` build type only to keep the package
# com.debank.rabbymobile.regression. A different signing key can never update
# the official com.debank.rabbymobile, so this installs next to the official app.
on:
  push:
    branches:
      - apk-build
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-test-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      RABBY_MOBILE_BUILD_ENV: production
      buildchannel: selfhost
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          SP: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          RC: ${{ secrets.RABBY_MOBILE_CODE }}
        run: |
          for v in KS SP KP KA RC; do
            if [ -z "${!v}" ]; then echo "::error::missing signing secret ($v)"; exit 1; fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust toolchain from rust-toolchain.toml
        working-directory: packages/react-native-fs/rust/safe-svg
        run: |
          rustup toolchain install
          cargo --version
          cargo test --release

      - name: Install JS dependencies
        run: |
          corepack enable
          yarn install

      - name: Build workspace packages
        run: yarn build

      - name: Prepare Android JS assets
        working-directory: apps/mobile
        run: |
          . ./scripts/fns.sh --source-only
          ensure_inpage_bridge_assets
          yarn check-nodeengines
          yarn ../mobile-local-pages make-theme
          yarn ../mobile-local-pages build --mode android
          yarn react-native-asset
          sh ./scripts/fns.sh reset_builtin_assets
          yarn buildworker:prod:android

      - name: Use the production name, icon and manifest
        working-directory: apps/mobile/android/app/src/regression
        run: |
          # Drop the "Reg Rabby Wallet" name/icon overlay and the regression
          # deep-link manifest so the main (production) resources apply.
          # google-services.json stays: it must match the .regression package.
          rm -rf res
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android" />' > AndroidManifest.xml

      - name: Assemble signed regression APK (arm64-v8a)
        working-directory: apps/mobile/android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          RABBY_MOBILE_CODE: ${{ secrets.RABBY_MOBILE_CODE }}
          RABBY_MOBILE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RABBY_MOBILE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RABBY_MOBILE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export RABBY_MOBILE_ANDROID_STORE_FILE="$RUNNER_TEMP/rabby-fork.keystore"
          printf %s "$KS" | base64 -d > "$RABBY_MOBILE_ANDROID_STORE_FILE"
          ./gradlew assembleRegression -PreactNativeArchitectures=arm64-v8a --no-daemon
          rm -f "$RABBY_MOBILE_ANDROID_STORE_FILE"

      - name: Collect APK
        id: apk
        run: |
          src=$(find apps/mobile/android/app/build/outputs/apk/regression -name '*.apk' | head -n 1)
          test -n "$src"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$src" | tee signer.txt
          grep -q "certificate SHA-256 digest: 61b3b565e8959354a57dff200100f2458c39dbf76f73b30eb08499624dab6cc3" signer.txt
          out="rabby-wallet-fork-svgfix-${GITHUB_SHA::7}-arm64.apk"
          cp "$src" "$out"
          ls -lh "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: rabby-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish release on the fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-prod-${GITHUB_SHA::7}"
          gh release create "$tag" "${{ steps.apk.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Rabby Wallet (fork, production config) + SVG font fix (${GITHUB_SHA::7})" \
            --notes "Production runtime, name and icon, arm64-v8a, with the fix from fix/safe-svg-strip-font-face. Signed with the fork owner's key. Package com.debank.rabbymobile.regression: installs next to the official app (it cannot update it). Unofficial build: no auto-updates."
