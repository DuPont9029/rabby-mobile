[package]
name = "rabby-helios-node"
version = "0.1.0"
edition = "2021"
publish = false
description = "In-process a16z Helios light client (Ethereum mainnet) behind a C ABI"

[lib]
name = "rabby_helios_node"
crate-type = ["cdylib", "rlib"]

[dependencies]
# a16z/helios 0.12.0 (commit pinned in scripts/fetch-helios.sh, patched by
# patches/helios.patch). Fetched into vendor/ before building.
helios-ethereum = { path = "vendor/helios/ethereum" }
helios-core = { path = "vendor/helios/core" }
alloy = { version = "2.1.0", default-features = false, features = ["eips", "rpc-types"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
